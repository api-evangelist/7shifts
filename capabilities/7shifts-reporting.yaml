naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Reporting"
  description: 'Reporting surface of the 7shifts API. 1 operations. Lead operation: Retrieve Daily Sales
    And Labor. Self-contained Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Reporting
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-reporting
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Reporting business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-reports-daily-sales-and-labor
      path: /v2/company/{company_id}/reports/daily_sales_and_labor
      operations:
      - name: retrieveDailySalesAndLabor
        method: GET
        description: Retrieve Daily Sales And Labor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: location_id
          in: query
          type: integer
          required: false
          description: Filter by location.
        - name: start_date
          in: query
          type: string
          required: false
          description: Start date (YYYY-MM-DD).
        - name: end_date
          in: query
          type: string
          required: false
          description: End date (YYYY-MM-DD).
  exposes:
  - type: rest
    namespace: 7shifts-reporting-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Reporting. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-reports-daily-sales-and-labor
      name: v2-company-company-id-reports-daily-sales-and-labor
      description: REST surface for v2-company-company-id-reports-daily-sales-and-labor.
      operations:
      - method: GET
        name: retrieveDailySalesAndLabor
        description: Retrieve Daily Sales And Labor
        call: 7shifts-reporting.retrieveDailySalesAndLabor
        with:
          company_id: rest.company_id
          location_id: rest.location_id
          start_date: rest.start_date
          end_date: rest.end_date
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-reporting-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Reporting. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: retrieve-daily-sales-labor
      description: Retrieve Daily Sales And Labor
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-reporting.retrieveDailySalesAndLabor
      with:
        company_id: tools.company_id
        location_id: tools.location_id
        start_date: tools.start_date
        end_date: tools.end_date
      outputParameters:
      - type: object
        mapping: $.
