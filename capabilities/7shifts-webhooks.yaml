naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Webhooks"
  description: 'Webhooks surface of the 7shifts API. 2 operations. Lead operation: List Webhooks. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Webhooks
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-webhooks
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Webhooks business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-webhooks
      path: /v2/company/{company_id}/webhooks
      operations:
      - name: listWebhooks
        method: GET
        description: List Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
      - name: createWebhook
        method: POST
        description: Create Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-webhooks-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Webhooks. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-webhooks
      name: v2-company-company-id-webhooks
      description: REST surface for v2-company-company-id-webhooks.
      operations:
      - method: GET
        name: listWebhooks
        description: List Webhooks
        call: 7shifts-webhooks.listWebhooks
        with:
          company_id: rest.company_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-webhooks
      name: v2-company-company-id-webhooks
      description: REST surface for v2-company-company-id-webhooks.
      operations:
      - method: POST
        name: createWebhook
        description: Create Webhook
        call: 7shifts-webhooks.createWebhook
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-webhooks-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Webhooks. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: list-webhooks
      description: List Webhooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-webhooks.listWebhooks
      with:
        company_id: tools.company_id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-webhook
      description: Create Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-webhooks.createWebhook
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
