naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Companies"
  description: 'Companies surface of the 7shifts API. 2 operations. Lead operation: List Companies. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Companies
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-companies
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Companies business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-companies
      path: /v2/companies
      operations:
      - name: listCompanies
        method: GET
        description: List Companies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: modified_since
          in: query
          type: string
          required: false
          description: Return companies modified since the specified date (YYYY-MM-DD).
        - name: x-api-version
          in: header
          type: string
          required: false
          description: 7shifts API version (YYYY-MM-DD).
        - name: x-company-guid
          in: header
          type: string
          required: false
          description: Company GUID.
    - name: v2-companies-company-id
      path: /v2/companies/{company_id}
      operations:
      - name: retrieveCompany
        method: GET
        description: Retrieve Company
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: x-api-version
          in: header
          type: string
          required: false
          description: 7shifts API version (YYYY-MM-DD).
  exposes:
  - type: rest
    namespace: 7shifts-companies-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Companies. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/companies
      name: v2-companies
      description: REST surface for v2-companies.
      operations:
      - method: GET
        name: listCompanies
        description: List Companies
        call: 7shifts-companies.listCompanies
        with:
          modified_since: rest.modified_since
          x-api-version: rest.x-api-version
          x-company-guid: rest.x-company-guid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies-company-id
      name: v2-companies-company-id
      description: REST surface for v2-companies-company-id.
      operations:
      - method: GET
        name: retrieveCompany
        description: Retrieve Company
        call: 7shifts-companies.retrieveCompany
        with:
          company_id: rest.company_id
          x-api-version: rest.x-api-version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-companies-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Companies. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: list-companies
      description: List Companies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-companies.listCompanies
      with:
        modified_since: tools.modified_since
        x-api-version: tools.x-api-version
        x-company-guid: tools.x-company-guid
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-company
      description: Retrieve Company
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-companies.retrieveCompany
      with:
        company_id: tools.company_id
        x-api-version: tools.x-api-version
      outputParameters:
      - type: object
        mapping: $.
