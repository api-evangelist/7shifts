naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Time Off"
  description: 'Time Off surface of the 7shifts API. 3 operations. Lead operation: List Time Off. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Time Off
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-time-off
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Time Off business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-time-off
      path: /v2/company/{company_id}/time_off
      operations:
      - name: listTimeOff
        method: GET
        description: List Time Off
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: user_id
          in: query
          type: integer
          required: false
          description: Filter by user.
        - name: status
          in: query
          type: string
          required: false
          description: Filter by request status.
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
      - name: createTimeOff
        method: POST
        description: Create Time Off
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
    - name: v2-company-company-id-time-off-time-off-id-approve
      path: /v2/company/{company_id}/time_off/{time_off_id}/approve
      operations:
      - name: approveTimeOff
        method: POST
        description: Approve Time Off Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: time_off_id
          in: path
          type: integer
          required: true
          description: Time off request identifier.
  exposes:
  - type: rest
    namespace: 7shifts-time-off-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Time Off. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-time-off
      name: v2-company-company-id-time-off
      description: REST surface for v2-company-company-id-time-off.
      operations:
      - method: GET
        name: listTimeOff
        description: List Time Off
        call: 7shifts-time-off.listTimeOff
        with:
          company_id: rest.company_id
          user_id: rest.user_id
          status: rest.status
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-time-off
      name: v2-company-company-id-time-off
      description: REST surface for v2-company-company-id-time-off.
      operations:
      - method: POST
        name: createTimeOff
        description: Create Time Off
        call: 7shifts-time-off.createTimeOff
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-time-off-time-off-id-approve
      name: v2-company-company-id-time-off-time-off-id-approve
      description: REST surface for v2-company-company-id-time-off-time-off-id-approve.
      operations:
      - method: POST
        name: approveTimeOff
        description: Approve Time Off Request
        call: 7shifts-time-off.approveTimeOff
        with:
          company_id: rest.company_id
          time_off_id: rest.time_off_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-time-off-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Time Off. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: list-time-off
      description: List Time Off
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-time-off.listTimeOff
      with:
        company_id: tools.company_id
        user_id: tools.user_id
        status: tools.status
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-time-off
      description: Create Time Off
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-time-off.createTimeOff
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: approve-time-off-request
      description: Approve Time Off Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-time-off.approveTimeOff
      with:
        company_id: tools.company_id
        time_off_id: tools.time_off_id
      outputParameters:
      - type: object
        mapping: $.
