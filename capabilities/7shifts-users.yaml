naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Users"
  description: 'Users surface of the 7shifts API. 4 operations. Lead operation: List Users. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Users
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-users
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Users business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-users
      path: /v2/company/{company_id}/users
      operations:
      - name: listUsers
        method: GET
        description: List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: modified_since
          in: query
          type: string
          required: false
          description: Filter by modification date (YYYY-MM-DD).
        - name: location_id
          in: query
          type: integer
          required: false
          description: Filter by location (mutually exclusive with department_id and role_id).
        - name: department_id
          in: query
          type: integer
          required: false
          description: Filter by department (mutually exclusive with location_id and role_id).
        - name: role_id
          in: query
          type: integer
          required: false
          description: Filter by role (mutually exclusive with location_id and department_id).
        - name: status
          in: query
          type: string
          required: false
          description: User status filter.
        - name: name
          in: query
          type: string
          required: false
          description: Partial or full employee name filter.
        - name: sort_by
          in: query
          type: string
          required: false
          description: Sort field and direction (e.g. firstname.asc,lastname.desc).
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
        - name: x-api-version
          in: header
          type: string
          required: false
          description: 7shifts API version (YYYY-MM-DD).
        - name: x-company-guid
          in: header
          type: string
          required: false
          description: Company GUID.
      - name: createUser
        method: POST
        description: Create User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
    - name: v2-company-company-id-users-identifier
      path: /v2/company/{company_id}/users/{identifier}
      operations:
      - name: retrieveUser
        method: GET
        description: Retrieve User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: identifier
          in: path
          type: string
          required: true
          description: User identifier. Accepts either a 7shifts user ID or a punch ID with the prefix
            "punch:".
        - name: include_inactive
          in: query
          type: boolean
          required: false
          description: Include inactive users in the response.
        - name: x-api-version
          in: header
          type: string
          required: false
          description: 7shifts API version (YYYY-MM-DD).
        - name: x-company-guid
          in: header
          type: string
          required: false
          description: Company GUID.
      - name: updateUser
        method: PUT
        description: Update User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: identifier
          in: path
          type: string
          required: true
          description: User identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-users-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Users. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-users
      name: v2-company-company-id-users
      description: REST surface for v2-company-company-id-users.
      operations:
      - method: GET
        name: listUsers
        description: List Users
        call: 7shifts-users.listUsers
        with:
          company_id: rest.company_id
          modified_since: rest.modified_since
          location_id: rest.location_id
          department_id: rest.department_id
          role_id: rest.role_id
          status: rest.status
          name: rest.name
          sort_by: rest.sort_by
          cursor: rest.cursor
          limit: rest.limit
          x-api-version: rest.x-api-version
          x-company-guid: rest.x-company-guid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-users
      name: v2-company-company-id-users
      description: REST surface for v2-company-company-id-users.
      operations:
      - method: POST
        name: createUser
        description: Create User
        call: 7shifts-users.createUser
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-users-identifier
      name: v2-company-company-id-users-identifier
      description: REST surface for v2-company-company-id-users-identifier.
      operations:
      - method: GET
        name: retrieveUser
        description: Retrieve User
        call: 7shifts-users.retrieveUser
        with:
          company_id: rest.company_id
          identifier: rest.identifier
          include_inactive: rest.include_inactive
          x-api-version: rest.x-api-version
          x-company-guid: rest.x-company-guid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-users-identifier
      name: v2-company-company-id-users-identifier
      description: REST surface for v2-company-company-id-users-identifier.
      operations:
      - method: PUT
        name: updateUser
        description: Update User
        call: 7shifts-users.updateUser
        with:
          company_id: rest.company_id
          identifier: rest.identifier
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-users-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Users. One tool per consumed operation, routed inline\
      \ through this capability's consumes block."
    tools:
    - name: list-users
      description: List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-users.listUsers
      with:
        company_id: tools.company_id
        modified_since: tools.modified_since
        location_id: tools.location_id
        department_id: tools.department_id
        role_id: tools.role_id
        status: tools.status
        name: tools.name
        sort_by: tools.sort_by
        cursor: tools.cursor
        limit: tools.limit
        x-api-version: tools.x-api-version
        x-company-guid: tools.x-company-guid
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create User
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-users.createUser
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-user
      description: Retrieve User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-users.retrieveUser
      with:
        company_id: tools.company_id
        identifier: tools.identifier
        include_inactive: tools.include_inactive
        x-api-version: tools.x-api-version
        x-company-guid: tools.x-company-guid
      outputParameters:
      - type: object
        mapping: $.
    - name: update-user
      description: Update User
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: 7shifts-users.updateUser
      with:
        company_id: tools.company_id
        identifier: tools.identifier
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
