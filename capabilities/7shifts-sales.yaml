naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Sales"
  description: 'Sales surface of the 7shifts API. 2 operations. Lead operation: List Receipts. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Sales
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-sales
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Sales business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-receipts
      path: /v2/company/{company_id}/receipts
      operations:
      - name: listReceipts
        method: GET
        description: List Receipts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: location_id
          in: query
          type: integer
          required: false
          description: Filter by location.
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
      - name: createReceipt
        method: POST
        description: Create Receipt
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-sales-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Sales. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-receipts
      name: v2-company-company-id-receipts
      description: REST surface for v2-company-company-id-receipts.
      operations:
      - method: GET
        name: listReceipts
        description: List Receipts
        call: 7shifts-sales.listReceipts
        with:
          company_id: rest.company_id
          location_id: rest.location_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-receipts
      name: v2-company-company-id-receipts
      description: REST surface for v2-company-company-id-receipts.
      operations:
      - method: POST
        name: createReceipt
        description: Create Receipt
        call: 7shifts-sales.createReceipt
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-sales-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Sales. One tool per consumed operation, routed inline\
      \ through this capability's consumes block."
    tools:
    - name: list-receipts
      description: List Receipts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-sales.listReceipts
      with:
        company_id: tools.company_id
        location_id: tools.location_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-receipt
      description: Create Receipt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-sales.createReceipt
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
