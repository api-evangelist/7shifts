naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Departments"
  description: 'Departments surface of the 7shifts API. 2 operations. Lead operation: List Departments.
    Self-contained Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Departments
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-departments
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Departments business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-departments
      path: /v2/company/{company_id}/departments
      operations:
      - name: listDepartments
        method: GET
        description: List Departments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: location_id
          in: query
          type: integer
          required: false
          description: Filter departments by location.
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
      - name: createDepartment
        method: POST
        description: Create Department
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-departments-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Departments. One Spectral-compliant resource per\
      \ consumed operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-departments
      name: v2-company-company-id-departments
      description: REST surface for v2-company-company-id-departments.
      operations:
      - method: GET
        name: listDepartments
        description: List Departments
        call: 7shifts-departments.listDepartments
        with:
          company_id: rest.company_id
          location_id: rest.location_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-departments
      name: v2-company-company-id-departments
      description: REST surface for v2-company-company-id-departments.
      operations:
      - method: POST
        name: createDepartment
        description: Create Department
        call: 7shifts-departments.createDepartment
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-departments-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Departments. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: list-departments
      description: List Departments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-departments.listDepartments
      with:
        company_id: tools.company_id
        location_id: tools.location_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-department
      description: Create Department
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-departments.createDepartment
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
