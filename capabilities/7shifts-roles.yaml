naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Roles"
  description: 'Roles surface of the 7shifts API. 2 operations. Lead operation: List Roles. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Roles
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-roles
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Roles business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-roles
      path: /v2/company/{company_id}/roles
      operations:
      - name: listRoles
        method: GET
        description: List Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: department_id
          in: query
          type: integer
          required: false
          description: Filter roles by department.
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
      - name: createRole
        method: POST
        description: Create Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-roles-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Roles. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-roles
      name: v2-company-company-id-roles
      description: REST surface for v2-company-company-id-roles.
      operations:
      - method: GET
        name: listRoles
        description: List Roles
        call: 7shifts-roles.listRoles
        with:
          company_id: rest.company_id
          department_id: rest.department_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-roles
      name: v2-company-company-id-roles
      description: REST surface for v2-company-company-id-roles.
      operations:
      - method: POST
        name: createRole
        description: Create Role
        call: 7shifts-roles.createRole
        with:
          company_id: rest.company_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-roles-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Roles. One tool per consumed operation, routed inline\
      \ through this capability's consumes block."
    tools:
    - name: list-roles
      description: List Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-roles.listRoles
      with:
        company_id: tools.company_id
        department_id: tools.department_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: create-role
      description: Create Role
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-roles.createRole
      with:
        company_id: tools.company_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
