naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Wages"
  description: 'Wages surface of the 7shifts API. 2 operations. Lead operation: List User Wages. Self-contained
    Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Wages
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-wages
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Wages business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-users-user-id-wages
      path: /v2/company/{company_id}/users/{user_id}/wages
      operations:
      - name: listUserWages
        method: GET
        description: List User Wages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: user_id
          in: path
          type: integer
          required: true
          description: User identifier.
      - name: createUserWage
        method: POST
        description: Create User Wage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: user_id
          in: path
          type: integer
          required: true
          description: User identifier.
        - name: body
          in: body
          type: object
          required: true
          description: Request payload.
  exposes:
  - type: rest
    namespace: 7shifts-wages-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Wages. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-users-user-id-wages
      name: v2-company-company-id-users-user-id-wages
      description: REST surface for v2-company-company-id-users-user-id-wages.
      operations:
      - method: GET
        name: listUserWages
        description: List User Wages
        call: 7shifts-wages.listUserWages
        with:
          company_id: rest.company_id
          user_id: rest.user_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/company-company-id-users-user-id-wages
      name: v2-company-company-id-users-user-id-wages
      description: REST surface for v2-company-company-id-users-user-id-wages.
      operations:
      - method: POST
        name: createUserWage
        description: Create User Wage
        call: 7shifts-wages.createUserWage
        with:
          company_id: rest.company_id
          user_id: rest.user_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-wages-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Wages. One tool per consumed operation, routed inline\
      \ through this capability's consumes block."
    tools:
    - name: list-user-wages
      description: List User Wages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-wages.listUserWages
      with:
        company_id: tools.company_id
        user_id: tools.user_id
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user-wage
      description: Create User Wage
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: 7shifts-wages.createUserWage
      with:
        company_id: tools.company_id
        user_id: tools.user_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
