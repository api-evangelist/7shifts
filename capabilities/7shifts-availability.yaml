naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Availability"
  description: 'Availability surface of the 7shifts API. 1 operations. Lead operation: List Availabilities.
    Self-contained Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Availability
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-availability
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Availability business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: v2-company-company-id-availability
      path: /v2/company/{company_id}/availability
      operations:
      - name: listAvailabilities
        method: GET
        description: List Availabilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: company_id
          in: path
          type: integer
          required: true
          description: Company identifier.
        - name: user_id
          in: query
          type: integer
          required: false
          description: Filter by user.
        - name: cursor
          in: query
          type: string
          required: false
          description: Pagination cursor for the next or previous page.
        - name: limit
          in: query
          type: integer
          required: false
          description: Results per page (1-500, default 100; 20 for some collections).
  exposes:
  - type: rest
    namespace: 7shifts-availability-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Availability. One Spectral-compliant resource per\
      \ consumed operation, prefixed with /v1."
    resources:
    - path: /v1/company-company-id-availability
      name: v2-company-company-id-availability
      description: REST surface for v2-company-company-id-availability.
      operations:
      - method: GET
        name: listAvailabilities
        description: List Availabilities
        call: 7shifts-availability.listAvailabilities
        with:
          company_id: rest.company_id
          user_id: rest.user_id
          cursor: rest.cursor
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-availability-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Availability. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: list-availabilities
      description: List Availabilities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-availability.listAvailabilities
      with:
        company_id: tools.company_id
        user_id: tools.user_id
        cursor: tools.cursor
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
