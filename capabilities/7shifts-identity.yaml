naftiko: 1.0.0-alpha2
info:
  label: "7shifts API \u2014 Identity"
  description: 'Identity surface of the 7shifts API. 1 operations. Lead operation: Retrieve Identity.
    Self-contained Naftiko capability covering one 7shifts business surface.'
  tags:
  - 7shifts
  - Identity
  created: '2026-06-02'
  modified: '2026-06-02'
binds:
- namespace: env
  keys:
    SEVENSHIFTS_ACCESS_TOKEN: SEVENSHIFTS_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: 7shifts-identity
    baseUri: https://api.7shifts.com
    description: "7shifts API \u2014 Identity business capability. Self-contained, no shared references."
    authentication:
      type: bearer
      token: '{{env.SEVENSHIFTS_ACCESS_TOKEN}}'
    resources:
    - name: whoami
      path: /whoami
      operations:
      - name: retrieveIdentity
        method: GET
        description: Retrieve Identity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: 7shifts-identity-rest
    port: 8080
    description: "REST adapter for 7shifts API \u2014 Identity. One Spectral-compliant resource per consumed\
      \ operation, prefixed with /v1."
    resources:
    - path: /v1/whoami
      name: whoami
      description: REST surface for whoami.
      operations:
      - method: GET
        name: retrieveIdentity
        description: Retrieve Identity
        call: 7shifts-identity.retrieveIdentity
        with: {}
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: 7shifts-identity-mcp
    port: 9090
    transport: http
    description: "MCP adapter for 7shifts API \u2014 Identity. One tool per consumed operation, routed\
      \ inline through this capability's consumes block."
    tools:
    - name: retrieve-identity
      description: Retrieve Identity
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: 7shifts-identity.retrieveIdentity
      with: {}
      outputParameters:
      - type: object
        mapping: $.
